plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services") version "4.4.4"
}

android {
    namespace 'msku.ceng.madproject.studybuddy'
    compileSdk 36 // Version parantezini kaldırıp direkt sayı yazabilirsin

    defaultConfig {
        applicationId "msku.ceng.madproject.studybuddy"
        minSdk 25
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.github.PhilJay:MPAndroidChart:3.1.0'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Firebase BoM (Versiyon yönetimini sağlar)
    implementation(platform(libs.firebase.bom))

    // Firebase Servisleri
    implementation libs.firebase.auth
    implementation libs.firebase.database // Mevcut Realtime DB
    implementation "com.google.firebase:firebase-firestore" // YENİ: Firestore'u buraya ekledik

    implementation libs.play.services.auth
    implementation libs.play.services.tasks

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}